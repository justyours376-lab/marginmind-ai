<mjml>
  <mj-head>
    <mj-title>MarginMind AI: {{title}}</mj-title>
    <mj-preview>{{message}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="Arial, Helvetica, sans-serif" />
      <mj-text color="#1f2937" font-size="15px" line-height="1.6" padding="0" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f7f5ee">
    <mj-section background-color="#0f3d2e" padding="20px 32px"><mj-column>
      <mj-text color="#d4a63a" font-size="18px" font-weight="700">MarginMind AI</mj-text>
    </mj-column></mj-section>
    <mj-section background-color="#ffffff" padding="36px 32px"><mj-column>
      <mj-text font-size="24px" font-weight="700" color="#0f3d2e" padding="0 0 8px">{{title}}</mj-text>
      <mj-text color="#6b7280" padding="0 0 20px">Your AI dropshipping assistant has an update.</mj-text>
      <mj-text>{{message}}</mj-text>
    </mj-column></mj-section>
    <mj-section padding="20px 32px"><mj-column>
      <mj-text color="#6b7280" font-size="12px">You receive this because notifications are on in MarginMind AI settings.</mj-text>
    </mj-column></mj-section>
  </mj-body>
</mjml>
